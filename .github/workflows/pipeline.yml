name: Rollback Demo | Pipeline

on:
  push:
    branches: [main]
  schedule:
    # Vigia: se o ciclo contínuo parar por algum motivo, este agendamento o reinicia.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      fail_rate:
        description: "Taxa de erro simulada (0 a 1). Use 0.5 para forçar rollback."
        default: "0"
      continuo:
        description: "Encadeia a próxima execução (alterna deploy saudável e com falha)."
        type: boolean
        default: false

concurrency:
  group: rollback-demo
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/demo-app
  APP_VERSION: ${{ github.sha }}
  FAIL_RATE: ${{ inputs.fail_rate || '0' }}
  DT_ENV_URL: ${{ vars.DT_ENV_URL || secrets.DT_ENV_URL }}
  DT_CLIENT_ID: ${{ secrets.DT_CLIENT_ID }}
  DT_CLIENT_SECRET: ${{ secrets.DT_CLIENT_SECRET }}
  DT_ACCOUNT_URN: ${{ secrets.DT_ACCOUNT_URN }}
  ENVIRONMENT: demo

jobs:
  build:
    name: Build e push da imagem
    # Execuções do ciclo reutilizam a imagem já publicada para o commit.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}:${{ env.APP_VERSION }}

  test:
    name: Testes
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test
        working-directory: app

  deploy:
    name: Deploy, validação SRG e rollback
    needs: test
    if: ${{ always() && !cancelled() && needs.build.result != 'failure' && needs.test.result != 'failure' }}
    runs-on: [self-hosted, rollback-demo]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy do demo-app no k3s
        run: |
          scripts/send-sdlc-event.sh started deploy pending
          export IMAGE="${IMAGE}:${APP_VERSION}"
          kubectl apply -f k8s/namespace.yaml
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          kubectl -n rollback-demo rollout status deploy/demo-app --timeout=180s
          scripts/send-sdlc-event.sh finished deploy success
      # O OneAgent só gera métricas de serviço se houver requisições.
      - name: Gerar tráfego pós-deploy
        run: |
          IP=$(kubectl -n rollback-demo get svc demo-app -o jsonpath='{.spec.clusterIP}')
          end=$((SECONDS + ${TRAFFIC_SECONDS:-100}))
          while [ $SECONDS -lt $end ]; do curl -s -o /dev/null "http://${IP}/" || true; sleep 0.2; done
      # O evento SDLC dispara o workflow do Dynatrace que executa o SRG.
      - name: Validar saúde pós-deploy (SRG)
        id: srg
        continue-on-error: true
        run: scripts/wait-srg.sh deploy
      - name: Rollback automático (rollout undo)
        if: steps.srg.outcome == 'failure'
        run: |
          scripts/send-sdlc-event.sh started rollback pending
          kubectl -n rollback-demo rollout undo deploy/demo-app
          kubectl -n rollback-demo rollout status deploy/demo-app --timeout=180s
          scripts/send-sdlc-event.sh finished rollback success
      - name: Gerar tráfego pós-rollback
        if: steps.srg.outcome == 'failure'
        run: |
          IP=$(kubectl -n rollback-demo get svc demo-app -o jsonpath='{.spec.clusterIP}')
          end=$((SECONDS + ${TRAFFIC_SECONDS:-100}))
          while [ $SECONDS -lt $end ]; do curl -s -o /dev/null "http://${IP}/" || true; sleep 0.2; done
      - name: Validar saúde pós-rollback (SRG)
        if: steps.srg.outcome == 'failure'
        run: scripts/wait-srg.sh rollback
      - name: Resumo do ciclo
        if: always() && steps.srg.outcome != 'skipped'
        run: |
          if [ "${{ steps.srg.outcome }}" = "failure" ]; then
            echo "### ↩️ Rollback automático executado" >> "$GITHUB_STEP_SUMMARY"
            echo "O SRG reprovou o deploy ${GITHUB_RUN_ID}; a versão anterior foi restaurada e validada de novo." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Deploy saudável" >> "$GITHUB_STEP_SUMMARY"
            echo "O SRG aprovou o deploy ${GITHUB_RUN_ID}; nenhum rollback necessário." >> "$GITHUB_STEP_SUMMARY"
          fi

  proximo-ciclo:
    name: Próximo ciclo (loop contínuo)
    needs: deploy
    if: ${{ always() && (github.event_name == 'schedule' || inputs.continuo == true) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Disparar a próxima execução, alternando o cenário
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.fail_rate || '0' }}" = "0" ]; then NEXT=0.5; else NEXT=0; fi
          sleep 30
          gh workflow run pipeline.yml --repo "${{ github.repository }}" -f fail_rate="$NEXT" -f continuo=true
