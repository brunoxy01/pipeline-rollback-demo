name: pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fail_rate:
        description: "Taxa de erro simulada (0 a 1). Use 0.5 para forçar rollback."
        default: "0"

env:
  IMAGE: ghcr.io/${{ github.repository }}/demo-app
  APP_VERSION: ${{ github.sha }}
  FAIL_RATE: ${{ inputs.fail_rate || '0' }}
  DT_ENV_URL: ${{ vars.DT_ENV_URL || secrets.DT_ENV_URL }}
  DT_CLIENT_ID: ${{ secrets.DT_CLIENT_ID }}
  DT_CLIENT_SECRET: ${{ secrets.DT_CLIENT_SECRET }}
  DT_ACCOUNT_URN: ${{ secrets.DT_ACCOUNT_URN }}
  ENVIRONMENT: demo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}:${{ env.APP_VERSION }}

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test
        working-directory: app

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
      - name: Deploy
        run: |
          scripts/send-sdlc-event.sh started deploy pending
          export IMAGE="${IMAGE}:${APP_VERSION}"
          kubectl apply -f k8s/namespace.yaml
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          kubectl -n rollback-demo rollout status deploy/demo-app --timeout=180s
          scripts/send-sdlc-event.sh finished deploy success
      # O evento SDLC dispara o workflow do Dynatrace que executa o SRG.
      - name: Validar deploy com SRG
        id: srg
        continue-on-error: true
        run: scripts/wait-srg.sh deploy
      - name: Rollback
        if: steps.srg.outcome == 'failure'
        run: |
          scripts/send-sdlc-event.sh started rollback pending
          kubectl -n rollback-demo rollout undo deploy/demo-app
          kubectl -n rollback-demo rollout status deploy/demo-app --timeout=180s
          scripts/send-sdlc-event.sh finished rollback success
      - name: Validar rollback com SRG
        if: steps.srg.outcome == 'failure'
        run: scripts/wait-srg.sh rollback
      - name: Falhar pipeline se houve rollback
        if: steps.srg.outcome == 'failure'
        run: exit 1
