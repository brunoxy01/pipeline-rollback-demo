      columnsCount: 40
      mode: responsive
  tiles:
    "1":
      content: "## Rollbacks automatizados | quantidade e saúde\nCada deploy é validado pelo **Site Reliability Guardian**. Se reprovar, a pipeline faz **rollback automático** e o SRG valida a saúde de novo (\U0001F7E2 pass, \U0001F7E1 warning, \U0001F534 fail). Use o filtro **App** para escolher o serviço e o seletor de tempo para a janela.\n"
      type: markdown
    "2":
      davis:
        davisVisualization:
          isAvailable: true
      query: |-
        fetch events
        | filter event.kind == "SDLC_EVENT" and event.category == "deployment" and event.type == "finished" and product == "rollback-demo"
        | filter service == $App
        | filter not startsWith(deployment.id, "trigger-test") and not startsWith(deployment.id, "corr-test")
        | summarize deploys = countIf(deployment.type == "deploy")
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Deploys
      type: data
      visualization: singleValue
      visualizationSettings:
        coloring:
          colorRules:
            - color: 'var(--dt-colors-charts-apdex-excellent-default, #009f68)'
              colorMode: single-color
              comparator: ≥
              field: deploys
              type: long
              value: null
        singleValue:
          colorThresholdTarget: background
          labelMode: none
          recordField: deploys
    "3":
      davis:
        davisVisualization:
          isAvailable: true
      query: |-
        fetch events
        | filter event.kind == "SDLC_EVENT" and event.category == "deployment" and event.type == "finished" and product == "rollback-demo"
        | filter service == $App
        | filter not startsWith(deployment.id, "trigger-test") and not startsWith(deployment.id, "corr-test")
        | summarize rollbacks = countIf(deployment.type == "rollback")
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Rollbacks automáticos
      type: data
      visualization: singleValue
      visualizationSettings:
        coloring:
          colorRules:
            - colorMode: custom-color
              comparator: '>'
              customColor:
                Default: '#cd8100'
              field: rollbacks
              value: 0
        singleValue:
          colorThresholdTarget: background
          labelMode: none
          recordField: rollbacks
    "4":
      davis:
        davisVisualization:
          isAvailable: true
      query: |-
        fetch events
        | filter event.kind == "SDLC_EVENT" and event.category == "deployment" and event.type == "finished" and product == "rollback-demo"
        | filter service == $App
        | filter not startsWith(deployment.id, "trigger-test") and not startsWith(deployment.id, "corr-test")
        | summarize deploys = countIf(deployment.type == "deploy"), rollbacks = countIf(deployment.type == "rollback")
        | fieldsAdd rollback_rate_pct = if(deploys > 0, 100.0 * rollbacks / deploys, else: 0.0)
        | fields rollback_rate_pct
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Taxa de rollback (% dos deploys)
      type: data
      visualization: singleValue
      visualizationSettings:
        singleValue:
          labelMode: none
          recordField: rollback_rate_pct
    "5":
      davis:
        davisVisualization:
          isAvailable: true
      query: |-
        fetch bizevents
        | filter event.type == "rollback.demo.validation" and deployment.type == "rollback"
        | filter service == $App
        | filter not startsWith(deployment.id, "trigger-test") and not startsWith(deployment.id, "corr-test")
        | summarize healthy = countIf(validation.status == "pass" or validation.status == "warning"), total = count()
        | fieldsAdd post_rollback_health_pct = if(total > 0, 100.0 * healthy / total, else: 0.0)
        | fields post_rollback_health_pct
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Saúde pós-rollback (% de validações saudáveis)
      type: data
      visualization: singleValue
      visualizationSettings:
        coloring:
          colorRules:
            - colorMode: custom-color
              comparator: <
              customColor:
                Default: '#c4233b'
              field: post_rollback_health_pct
              value: 90
        singleValue:
          colorThresholdTarget: background
          labelMode: none
          recordField: post_rollback_health_pct
    "6":
      davis:
        davisVisualization:
          isAvailable: true
      query: |-
        fetch events
        | filter event.kind == "SDLC_EVENT" and product == "rollback-demo" and service == $App
        | filter not startsWith(deployment.id, "trigger-test") and not startsWith(deployment.id, "corr-test")
        | fieldsAdd t_dep = if(deployment.type == "deploy" and event.type == "finished", timestamp),
                    t_rb = if(deployment.type == "rollback" and event.type == "finished", timestamp)
        | summarize dep = min(t_dep), rb = max(t_rb), by:{task.id}
        | filter isNotNull(rb) and isNotNull(dep)
        | fieldsAdd seconds_to_rollback = toDouble(rb - dep) / 1000000000
        | summarize avg_seconds_to_rollback = avg(seconds_to_rollback)
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Tempo médio até o rollback concluir (s)
      type: data
      visualization: singleValue
      visualizationSettings:
        singleValue:
          labelMode: none
          recordField: avg_seconds_to_rollback
    "7":
      davis:
        davisVisualization:
          isAvailable: true
      query: |-
        fetch events
        | filter event.kind == "SDLC_EVENT" and event.category == "deployment" and event.type == "finished" and product == "rollback-demo"
        | filter service == $App
        | filter not startsWith(deployment.id, "trigger-test") and not startsWith(deployment.id, "corr-test")
        | makeTimeseries count = count(), by:{deployment.type}, interval: 30m
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Deploys e rollbacks ao longo do tempo
      type: data
      visualization: barChart
      visualizationSettings:
        coloring:
          colorRules:
            - color: 'var(--dt-colors-charts-apdex-good-default, #007048)'
              colorMode: single-color
              comparator: = *value*
              field: DT.name
              type: string
              value: deploy
            - color: 'var(--dt-colors-charts-loglevel-error-default, #d40036)'
              colorMode: single-color
              comparator: = *value*
              field: DT.name
              type: string
              value: rollback
    "8":
      davis:
        davisVisualization:
          isAvailable: true
      query: |-
        fetch bizevents
        | filter event.type == "rollback.demo.validation" and service == $App
        | filter not startsWith(deployment.id, "trigger-test") and not startsWith(deployment.id, "corr-test")
        | summarize validations = count(), by:{deployment.type, validation.status}
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Resultado das validações do SRG (deploy x rollback)
      type: data
      visualization: categoricalBarChart
      visualizationSettings:
        coloring:
          colorRules:
            - color: 'var(--dt-colors-charts-apdex-excellent-default, #009f68)'
              colorMode: single-color
              comparator: = *value*
              field: DT.name
              type: string
              value: deploy • pass
            - color: 'var(--dt-colors-charts-loglevel-error-default, #d40036)'
              colorMode: single-color
              comparator: = *value*
              field: deployment.type
              type: string
              value: rollback
    "9":
      davis:
        davisVisualization:
          isAvailable: true
      query: "fetch bizevents\n| filter event.type == \"rollback.demo.validation\" and service == $App\n| filter not startsWith(deployment.id, \"trigger-test\") and not startsWith(deployment.id, \"corr-test\")\n| fieldsAdd resultado = if(validation.status == \"pass\", \"\U0001F7E2 pass\", else: if(validation.status == \"warning\", \"\U0001F7E1 warning\", else: \"\U0001F534 fail\"))\n| fieldsAdd etapa = if(deployment.type == \"rollback\", \"↩️ pós-rollback\", else: \"\U0001F680 pós-deploy\")\n| fields timestamp, etapa, resultado, deployment.id, release.version\n| sort timestamp desc\n| limit 20"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Últimas validações do SRG
      type: data
      visualization: table
      visualizationSettings:
        table:
          columnWidths:
            '["release.version"]': 285
            '["resultado"]': 136
            '["timestamp"]': 170
          sortBy:
            - columnId: '["release.version"]'
              direction: ascending
    "10":
      davis:
        davisVisualization:
          isAvailable: true
      query: "fetch events\n| filter event.kind == \"SDLC_EVENT\" and event.category == \"deployment\" and event.type == \"finished\" and product == \"rollback-demo\"\n| filter service == $App\n| filter not startsWith(deployment.id, \"trigger-test\") and not startsWith(deployment.id, \"corr-test\")\n| fieldsAdd evento = if(deployment.type == \"rollback\", \"↩️ rollback\", else: \"\U0001F680 deploy\")\n| fields timestamp, evento, deployment.id, release.version\n| sort timestamp desc\n| limit 20"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Linha do tempo de deploys e rollbacks
      type: data
      visualization: table
      visualizationSettings: {}
    "11":
      davis:
        davisVisualization:
          isAvailable: true
      query: "fetch bizevents\n| filter event.provider == \"dynatrace.site.reliability.guardian\" and event.type == \"guardian.validation.objective\"\n| filter contains(toString(guardian.tags), \"rollback-demo\")\n| parse guardian.objective, \"JSON:o\"\n| fieldsAdd objective = o[name], status = o[status], value = o[value]\n| fieldsAdd resultado = if(status == \"pass\", \"\U0001F7E2 pass\", else: if(status == \"warning\", \"\U0001F7E1 warning\", else: \"\U0001F534 fail\"))\n| fields timestamp, validation.id, objective, resultado, value\n| sort timestamp desc\n| limit 24"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Objetivos do guardian nas últimas validações
      type: data
      visualization: table
      visualizationSettings: {}
    "12":
      imageSettings:
        defaultSource: /platform/document/v1/documents/image-site-reliability-guardian/content
        horizontalAlignment: center
        sizing: fit
        verticalAlignment: center
      type: image
    "13":
      content: '--- '
      type: markdown
    "14":
      content: '--- '
      type: markdown
  variables:
    - defaultValue: demo-app
      input: |-
        fetch events
        | filter event.kind == "SDLC_EVENT" and product == "rollback-demo" and isNotNull(service)
        | summarize n = count(), by:{service}
        | fields service
      key: App
      multiple: false
      name: App
      type: query
      version: 3
      visible: true
  version: 21
