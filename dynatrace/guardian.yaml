# Referência (não é importável). No app Site Reliability Guardian, crie um objetivo por item:
# cole SOMENTE a query no campo "DQL query" (precisa retornar um único valor) e configure
# os limites de pass/warning na própria UI. Valide cada query com "Run query" antes de salvar.
# Guardian: rollback-demo-guardian | janela: 10m | sem dados = falha.
# Ajuste os filtros ao que o seu tenant coleta (service metrics exigem OneAgent/Operator).

objectives:
  - name: Taxa de erro HTTP (%)
    pass: "<= 1"
    warning: "<= 3"
    dql: |
      timeseries errors = sum(dt.service.request.failure_count),
                 total = sum(dt.service.request.count),
                 filter: {k8s.namespace.name == "rollback-demo"}
      | fieldsAdd error_rate = 100 * arraySum(errors) / arraySum(total)
      | fields error_rate

  - name: Latência p95 (ms)
    pass: "<= 500"
    warning: "<= 800"
    dql: |
      timeseries p95 = percentile(dt.service.request.response_time, 95),
                 filter: {k8s.namespace.name == "rollback-demo"}
      | fieldsAdd p95_ms = arrayMax(p95) / 1000
      | fields p95_ms

  - name: Container restarts
    pass: "<= 0"
    dql: |
      timeseries restarts = sum(dt.kubernetes.container.restarts),
                 filter: {k8s.namespace.name == "rollback-demo"}
      | fieldsAdd total_restarts = arraySum(restarts)
      | fields total_restarts

  - name: Uso de memória (% do limite de 128Mi)
    pass: "<= 80"
    warning: "<= 90"
    dql: |
      timeseries mem = avg(dt.kubernetes.container.memory_working_set),
                 filter: {k8s.namespace.name == "rollback-demo"}
      | fieldsAdd mem_pct = arrayMax(mem) / (128 * 1024 * 1024) * 100
      | fields mem_pct
